# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - smart-waste-management01

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - name: Set up Node.js version
    uses: actions/setup-node@v3
    with:
      node-version: '18.x'

  - name: Install dependencies (backend)
    run: |
      cd backend
      npm install

  - name: Build (if needed)
    run: |
      cd backend
      npm run build --if-present

  - name: Upload artifact for deployment job
    uses: actions/upload-artifact@v4
    with:
      name: node-app
      path: backend

deploy:
runs-on: ubuntu-latest
needs: build

steps:
  - name: Download artifact from build job
    uses: actions/download-artifact@v4
    with:
      name: node-app

  - name: Login to Azure
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6BF20497B2A44479B627581B6F249D07 }}
      tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FC6BFBCC1CF44E958864DCF2765CD7AB }}
      subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E64A2F6A55B411F9EF5F787BF915A99 }}

  - name: Deploy to Azure Web App
    uses: azure/webapps-deploy@v3
    with:
      app-name: 'smart-waste-management01'
      slot-name: 'Production'
      package: .
          
